<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 540" width="320" height="540" fill="none">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="35%" stop-color="#2D6A4F"/>
      <stop offset="70%" stop-color="#1A4329"/>
      <stop offset="100%" stop-color="#0F2417"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="50%" stop-color="#F77F00"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0d2b1a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Sachet Body Silhouette with Neck and Tear Notch -->
    <!-- Neck at top, standard 50ml gel pouch shape -->
    <path d="M120 20 
             C120 12, 128 8, 136 8 
             L184 8 
             C192 8, 200 12, 200 20 
             L200 56 
             C200 68, 208 76, 218 82 
             L264 110 
             C276 118, 284 130, 284 144 
             L284 490 
             C284 506, 272 518, 256 518 
             L64 518 
             C48 518, 36 506, 36 490 
             L36 144 
             C36 130, 44 118, 56 110 
             L102 82 
             C112 76, 120 68, 120 56 
             Z" 
          fill="url(#foilGrad)" stroke="#52B788" stroke-width="2"/>
    
    <!-- Sheen overlay -->
    <path d="M120 20 C120 12, 128 8, 136 8 L184 8 C192 8, 200 12, 200 20 L200 56 C200 68, 208 76, 218 82 L264 110 C276 118, 284 130, 284 144 L284 490 C284 506, 272 518, 256 518 L64 518 C48 518, 36 506, 36 490 L36 144 C36 130, 44 118, 56 110 L102 82 C112 76, 120 68, 120 56 Z" 
          fill="url(#foilSheen)"/>

    <!-- Tear notches -->
    <path d="M116 34 L126 38 L116 42 Z" fill="#FAF8F5" opacity="0.6"/>
    <path d="M204 34 L194 38 L204 42 Z" fill="#FAF8F5" opacity="0.6"/>
    <line x1="126" y1="38" x2="194" y2="38" stroke="#FAF8F5" stroke-dasharray="3 3" stroke-width="1.5" opacity="0.4"/>

    <!-- Top Seal Crimping Lines -->
    <line x1="124" y1="14" x2="196" y2="14" stroke="#52B788" stroke-width="1" opacity="0.4"/>
    <line x1="124" y1="18" x2="196" y2="18" stroke="#52B788" stroke-width="1" opacity="0.4"/>
    
    <!-- Bottom Seal Crimping Lines -->
    <line x1="42" y1="506" x2="278" y2="506" stroke="#52B788" stroke-width="1.5" opacity="0.4"/>
    <line x1="42" y1="512" x2="278" y2="512" stroke="#52B788" stroke-width="1.5" opacity="0.4"/>

    <!-- Dynamic Orange Wave Arc / Energy Accent -->
    <path d="M36 260 C80 230, 150 280, 220 240 C250 220, 270 230, 284 245 L284 370 C240 385, 180 340, 110 375 C70 395, 45 380, 36 365 Z" fill="url(#orangeGlow)" opacity="0.95"/>

    <!-- Sunlit Siam Orange Emblem (Central Graphic) -->
    <g transform="translate(160, 305)">
      <!-- Orange Outer Slice -->
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="0" r="40" fill="#F77F00"/>
      <!-- Slices -->
      <path d="M-4 -6 A 34 34 0 0 1 -28 -18 L-5 -4 Z" fill="#FFB703"/>
      <path d="M-2 -8 A 34 34 0 0 1 2 -32 L0 -4 Z" fill="#FFDDD2" opacity="0.9"/>
      <path d="M4 -6 A 34 34 0 0 1 28 -18 L5 -4 Z" fill="#FFB703"/>
      <path d="M6 0 A 34 34 0 0 1 30 16 L5 3 Z" fill="#FFB703"/>
      <path d="M3 6 A 34 34 0 0 1 0 32 L0 4 Z" fill="#FFB703"/>
      <path d="M-3 6 A 34 34 0 0 1 -30 16 L-5 3 Z" fill="#FFB703"/>
      <!-- Center Core -->
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Branding Typography on Sachet -->
    <!-- University Tag -->
    <text x="160" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#A7D7C5" letter-spacing="2" text-anchor="middle">UNIVERSITAS ANDALAS</text>

    <!-- Main Title -->
    <text x="160" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">JESIGOGEL</text>
    
    <!-- Subtitle / Category -->
    <text x="160" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFB703" letter-spacing="3" text-anchor="middle">NATURAL ENERGY GEL</text>
    
    <!-- Flavor / Origin -->
    <text x="160" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FAF8F5" text-anchor="middle">Jeruk Siam Gunung Omeh</text>
    <text x="160" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#B7E4C7" text-anchor="middle">Kab. Lima Puluh Kota</text>

    <!-- Highlights Badge -->
    <rect x="70" y="405" width="180" height="26" rx="13" fill="#0F2417" stroke="#40916C" stroke-width="1"/>
    <text x="160" y="422" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#D8F3DC" letter-spacing="0.5" text-anchor="middle">40% SARI JERUK ASLI</text>

    <!-- Key Attributes Footer on Sachet -->
    <text x="75" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#95D5B2">NETTO 50 ml</text>
    <text x="160" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFB703" text-anchor="middle">TRACEABLE</text>
    <text x="245" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#95D5B2" text-anchor="end">BATCH #JSG-001</text>

    <!-- Mini QR code silhouette in corner -->
    <rect x="146" y="475" width="28" height="24" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <text x="160" y="491" font-family="monospace" font-size="8" font-weight="bold" fill="#143621" text-anchor="middle">QR TRACE</text>
  </g>
</svg>